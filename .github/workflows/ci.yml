name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "20.19.0" }
          - { os: ubuntu-latest, node: "22" }
          - { os: macos-latest, node: "22" }
          - { os: windows-latest, node: "22" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run ci
      - if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npx playwright install --with-deps chromium
      - if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm run test:browser
      - if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        name: Minimum Chrome 120 smoke
        run: |
          curl --fail --location --silent --show-error -o "$RUNNER_TEMP/chrome120.zip" https://storage.googleapis.com/chrome-for-testing-public/120.0.6099.109/linux64/chrome-linux64.zip
          unzip -q "$RUNNER_TEMP/chrome120.zip" -d "$RUNNER_TEMP/chrome120"
          CHROME_PATH="$RUNNER_TEMP/chrome120/chrome-linux64/chrome" npm run test:browser
      - if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm audit --audit-level=high
      - if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chrome-ai-translate
          path: |
            dist/chrome-ai-translate.zip
            dist/chrome-ai-translate.zip.sha256
